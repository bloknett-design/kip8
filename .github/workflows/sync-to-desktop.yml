name: Sync content to kip8-desktop

# Автосинхронизация контента из kip8 в kip8-desktop (боевая десктоп-сборка).
# Синхронизируется ПОЛНЫЙ набор (Task 517 — расширение прежнего частичного):
#   - index.html + десктоп-модули (charts-desktop.js, devices-table-desktop.js)
#     — офлайн-fallback app://
#   - sw.js + scripts/*.gs (все 24, было 8) + scripts/sync-*.py + tests/
#     (tests/*.js + README.md) — фикстуры полного тестового прогона
#     (CI kip8-desktop, node tests/run-all.js); в Electron-сборку НЕ
#     попадают (files в package.json: index.html/images/data/electron)
#   - data/*.json + images/*.png + Системный промт — данные/ассеты/документация
# При пуше в main, меняющем эти файлы, workflow:
#   1. Копирует набор в kip8-desktop
#   2. Чистит мусор зеркала (scripts/DEPLOY-*.md — курс Task 510 на чистоту;
#     6 файлов Task 346-352-эры ломали ассерт test-task346 «DEPLOY удалён»)
#   3. Коммитит через PAT (секрет DESKTOP_SYNC_TOKEN)
# paths-триггеры прежние (Task 517: НЕ менять): docs-пуши (промт/worklog)
# НЕ гоняют десктоп-зеркало — полный набор протягивается пушем в
# index.html/sw.js/scripts/tests или workflow_dispatch.
# Аналог механизма kip8test -> kip8test-desktop (sync-to-desktop.yml в kip8test).

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'charts-desktop.js'
      - 'devices-table-desktop.js'
      - 'sw.js'
      - 'scripts/*.gs'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-to-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kip8
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Получить информацию о последнем коммите
        id: commit_info
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "msg=$(git log -1 --pretty=%s | head -c 100)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT

      - name: Клонировать kip8-desktop
        env:
          DESKTOP_SYNC_TOKEN: ${{ secrets.DESKTOP_SYNC_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${DESKTOP_SYNC_TOKEN}@github.com/bloknett-design/kip8-desktop.git" /tmp/kip8-desktop

      - name: Скопировать контент и фикстуры тестов
        run: |
          cp index.html /tmp/kip8-desktop/index.html
          # Task 147: модуль графиков (только десктоп) — нужен для офлайн-fallback app://
          cp charts-desktop.js /tmp/kip8-desktop/charts-desktop.js
          # Task 148: таблица приборов (только десктоп)
          cp devices-table-desktop.js /tmp/kip8-desktop/devices-table-desktop.js
          # Task 306-перенос (десктоп): фикстуры полного прогона тестов в kip8-desktop
          # Task 517: набор фикстур расширен до ПОЛНОГО — все scripts/*.gs (24, было 8:
          # не хватало StatusCodesInit.gs и др. → ENOENT; Utils дрейфовал pre-513) +
          # scripts/sync-*.py + data/*.json + images/*.png + Системный промт
          cp sw.js /tmp/kip8-desktop/sw.js
          cp "Системный_промт_для_приложения_КИПиА.md" /tmp/kip8-desktop/
          mkdir -p /tmp/kip8-desktop/scripts /tmp/kip8-desktop/tests \
                   /tmp/kip8-desktop/data /tmp/kip8-desktop/images
          cp scripts/*.gs /tmp/kip8-desktop/scripts/
          cp scripts/sync-*.py /tmp/kip8-desktop/scripts/
          cp tests/*.js tests/README.md /tmp/kip8-desktop/tests/
          cp data/*.json /tmp/kip8-desktop/data/
          cp images/*.png /tmp/kip8-desktop/images/
          # Task 517: чистка зеркала (курс Task 510): DEPLOY-инструкции старше
          # недели в PWA-репо удаляются — зеркало тоже держим чистым.
          rm -f /tmp/kip8-desktop/scripts/DEPLOY-*.md
          # временный файл test-deploy-url.js (node --check Code.gs) не синхронизируем
          rm -f /tmp/kip8-desktop/scripts/.gscheck-code.js

      - name: Проверить, есть ли изменения
        id: changes
        run: |
          cd /tmp/kip8-desktop
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Нет изменений — пропускаем коммит"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Изменения обнаружены — коммитим"
          fi

      - name: Коммит и пуш в kip8-desktop
        if: steps.changes.outputs.changed == 'true'
        env:
          DESKTOP_SYNC_TOKEN: ${{ secrets.DESKTOP_SYNC_TOKEN }}
          SOURCE_SHA: ${{ steps.commit_info.outputs.sha }}
          SOURCE_MSG: ${{ steps.commit_info.outputs.msg }}
        run: |
          cd /tmp/kip8-desktop
          git config user.email "bot@kip8.local"
          git config user.name "kip-bot"
          git add index.html charts-desktop.js devices-table-desktop.js sw.js \
                  scripts/ tests/ data/ images/ \
                  "Системный_промт_для_приложения_КИПиА.md"
          # Коммит-сообщение: показываем, что это автосинхронизация и из какого SHA
          git commit -m "auto: sync content from kip8@${SOURCE_SHA}

          Source commit: ${SOURCE_SHA}
          Source message: ${SOURCE_MSG}

          Автоматически синхронизировано через GitHub Action sync-to-desktop.yml"
          git push origin main
          echo "✓ контент синхронизирован в kip8-desktop"

      - name: Summary
        if: always()
        run: |
          echo "## Sync summary"
          echo ""
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ контент обновлён в kip8-desktop (source: kip8@${{ steps.commit_info.outputs.sha }})"
          else
            echo "ℹ️ контент уже был актуален в kip8-desktop"
          fi
